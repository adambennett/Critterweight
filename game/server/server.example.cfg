# CRITTERWEIGHT dedicated server configuration (reference example).
# Copy this file next to the server executable, rename it (e.g. server.cfg), edit, then run:
#   Windows: CritterweightServer.exe --headless -- --server --config server.cfg
#   Linux:   ./CritterweightServer.x86_64 --headless -- --server --config server.cfg
# Full reference: docs/SERVER.md. Lines starting with # or ; are comments. Values are plain data
# (numbers, true/false, text; quotes optional). Unknown keys are reported and ignored; invalid
# values stop the server with an error that names the line.

[server]
# Shown in the LAN browser, lobby and admin status.
name = Critterweight Server
# UDP game port. Open/forward this port (UDP) for players outside your LAN.
port = 7777
# Interface to bind ("*" = all). Use a specific IP to restrict.
bind = *
# Human fighters (1-8) and spectators (0-8). Bots fill fighters per playlist entry.
max_players = 8
max_spectators = 4
# Empty = open server. Players must enter it (sent as a salted challenge proof, never in clear).
password =
# Message of the day, shown to players when they join (optional).
motd = Welcome to the cage. Be nice.
# Announce on the local network (UDP broadcast beacons on discovery_port..discovery_port+3).
lan_discovery = true
discovery_port = 7779
# Seconds without any packet before a player is considered disconnected (5-60).
timeout = 10
# Seconds a disconnected player's slot is kept (a bot holds their fighter) for a rejoin. 0 = off.
rejoin_grace = 60
# Simulation rate (Hz). Combat is tuned and tested at 120; other values are allowed but warned about.
tick_rate = 120
# Snapshots per second sent to each client (10-60). 30 is the tested default.
snapshot_rate = 30
# debug | info | warn | error. Logs: <user data>/logs/server.log (rotates at 2 MB, 3 files kept).
log_level = info
# A kicked player (same token, or same address + name) cannot rejoin for this many seconds.
kick_ban_seconds = 300
# Seconds between "stats:" lines in the log (tick cost, traffic, memory).
stats_interval = 60
# Mods this server loads, comma separated (core is always loaded), e.g. "moon_rules, rust_bucket".
# Exactly these are used - never a player's mod set. Players need the same gameplay mods in the
# same versions (presentation-only mods never matter). A missing mod stops the server (exit code 2).
mods =
# Folder with the mod packages (.critmod files or folders). Empty = <user data>/mods.
mods_dir =
# Relay co-op party messages between players (campaign co-op). false = players only talk to the server.
party_relay = true

[match]
# Playlist: a content playlist id (fight_night, bargain_bin, cannery_coop, or a mod's id) or a path
# to a playlist JSON file (see game/server/playlists/custom_rotation.example.json).
playlist = fight_night
# Fill empty fighter slots with bots when a playlist entry allows it (entry "bots" overrides).
bots = true
# rookie | regular | pro | champion
bot_difficulty = regular
# Lobby countdown (seconds) - voting happens here; it drops to 3 s once every player is ready.
lobby_time = 30
# Seconds the results stay up before the next vote/match starts automatically.
results_time = 12
# idle = no simulation while nobody is connected (lowest CPU);
# showcase = keep running bot matches on the rotation so joiners can watch immediately.
empty_behavior = idle
# Entries offered per vote (1-5; the playlist's own voting.candidates also caps it).
vote_candidates = 3
# AI Lab policies for bot slots, comma separated (e.g. dev_biped_es_drill); empty = scripted bots.
# Each bot fights as its policy's creature; a playlist entry's own bot_policy wins.
# Policies were trained on Classic combat: in Movesets matches those bots fight as scripted bots.
bot_policy =
# Combat style: playlist = each entry's own rules (every built-in preset plays Movesets);
# moves or classic = force that style for every match on this server.
combat = playlist
# true: each remote player's aim-assist setting (low/normal/high) applies to their fighter;
# false: the server gives everyone the normal level.
player_assist = true

[admin]
# Read admin commands from the server's standard input (type 'help').
console = true
# Optional TCP admin, bound to 127.0.0.1 ONLY (reach it remotely through an SSH tunnel).
# 0 = off. When enabled, token must be at least 16 characters; keep it secret.
port = 0
token =
