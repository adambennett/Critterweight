# Always-on public server: bonus-mode party rotation with bot fill, showcase matches when empty,
# local TCP admin for scripts/monitoring (reach it remotely only through an SSH tunnel).
# Before use: forward UDP 7777 on your router/firewall and SET A REAL TOKEN below (>= 16 chars).
# Run: ./CritterweightServer.x86_64 --headless -- --server --config always_on.cfg
[server]
name = Critterweight Bargain Bin (public)
port = 7777
max_players = 8
max_spectators = 8
password =
motd = Public test server. Matches rotate automatically; vote in the lobby.
lan_discovery = false
timeout = 12
rejoin_grace = 60
log_level = info
kick_ban_seconds = 1800
stats_interval = 60

[match]
playlist = bargain_bin
bots = true
bot_difficulty = pro
lobby_time = 25
results_time = 12
empty_behavior = showcase
vote_candidates = 3

[admin]
console = true
# TCP admin on 127.0.0.1:7780. Replace the token before enabling (port = 0 keeps it off).
port = 0
token = replace-with-a-long-random-secret
